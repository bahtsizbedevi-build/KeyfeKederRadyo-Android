name: Build Keyfe Keder Radyo Android

on:
  push:
    branches: [ main ]
    paths:
      - '**.kt'
      - '**.kts'
      - '**.xml'
      - '**.pro'
      - '.github/workflows/android-apk.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: Debug APK
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'
      - name: Build debug APK
        run: gradle assembleDebug --no-daemon
      - name: Upload debug APK
        uses: actions/upload-artifact@v6
        with:
          name: keyfe-keder-radyo-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  play-aab:
    name: Signed Play AAB
    runs-on: ubuntu-24.04
    env:
      EXPECTED_APPLICATION_ID: com.keyfekederradyo.android
      BUNDLETOOL_VERSION: '1.18.1'
    steps:
      - name: Check signing secrets (values are never printed)
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          missing=0
          for name in PLAY_KEYSTORE_BASE64 PLAY_KEYSTORE_PASSWORD PLAY_KEY_ALIAS PLAY_KEY_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::Secret $name is NOT set."
              missing=1
            else
              echo "Secret $name: set"
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "::error::Play release signing secrets are missing. No AAB is produced: an unsigned AAB cannot be uploaded to Google Play."
            echo "Add them under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v5
      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.13'

      - name: Decode upload keystore to runner temp
        env:
          PLAY_KEYSTORE_BASE64: ${{ secrets.PLAY_KEYSTORE_BASE64 }}
          PLAY_KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          PLAY_KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          PLAY_KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          KS="$RUNNER_TEMP/play-release.keystore"
          # Accept plain base64, wrapped lines, CRLF, or certutil -encode output (BEGIN/END header lines)
          printf '%s' "$PLAY_KEYSTORE_BASE64" | grep -v -e '-----' | tr -d ' \r\n\t' > "$RUNNER_TEMP/ks.b64"
          if ! base64 --decode "$RUNNER_TEMP/ks.b64" > "$KS" 2>/dev/null; then
            echo "::error::PLAY_KEYSTORE_BASE64 diagnostics: length $(wc -c < "$RUNNER_TEMP/ks.b64"), non-base64 chars $(tr -d 'A-Za-z0-9+/=' < "$RUNNER_TEMP/ks.b64" | wc -c), sha256 prefix $(sha256sum "$RUNNER_TEMP/ks.b64" | cut -c1-12)"
            rm -f "$RUNNER_TEMP/ks.b64"
            echo "::error::PLAY_KEYSTORE_BASE64 is not valid base64. Re-create it from the .jks/.keystore file (see docs/google-play-release.md)."
            exit 1
          fi
          rm -f "$RUNNER_TEMP/ks.b64"
          chmod 600 "$KS"
          MAGIC=$(head -c 4 "$KS" | od -An -tx1 | tr -d ' \n')
          echo "Decoded keystore: $(stat -c %s "$KS") bytes, header $MAGIC (feedfeed=JKS, 30xx=PKCS12)"
          if ! keytool -list -keystore "$KS" -storepass:env PLAY_KEYSTORE_PASSWORD > /dev/null 2>&1; then
            echo "::error::Keystore could not be opened. Either PLAY_KEYSTORE_BASE64 is not a keystore file or PLAY_KEYSTORE_PASSWORD is wrong."
            exit 1
          fi
          if ! keytool -list -keystore "$KS" -storepass:env PLAY_KEYSTORE_PASSWORD -alias "$PLAY_KEY_ALIAS" > /dev/null 2>&1; then
            echo "::error::Keystore opened, but alias from PLAY_KEY_ALIAS was not found. Aliases in this keystore:"
            keytool -list -keystore "$KS" -storepass:env PLAY_KEYSTORE_PASSWORD | grep -iE 'PrivateKeyEntry' | cut -d, -f1
            exit 1
          fi
          # Key password check (PKCS12 keystores require key password == store password)
          case "$MAGIC" in
            30*)
              # PKCS12 has a single password: the store password also unlocks the key
              if [ "$PLAY_KEY_PASSWORD" != "$PLAY_KEYSTORE_PASSWORD" ]; then
                echo "::notice::PKCS12 keystore: PLAY_KEY_PASSWORD differs from PLAY_KEYSTORE_PASSWORD; using PLAY_KEYSTORE_PASSWORD for the key."
              fi
              echo "KEYSTORE_IS_PKCS12=1" >> "$GITHUB_ENV" ;;
            *)
              if ! keytool -certreq -keystore "$KS" -storepass:env PLAY_KEYSTORE_PASSWORD -alias "$PLAY_KEY_ALIAS" -keypass:env PLAY_KEY_PASSWORD -file /dev/null > /dev/null 2>&1; then
                echo "::error::PLAY_KEY_PASSWORD is wrong for the key in this keystore."
                exit 1
              fi ;;
          esac
          echo "Upload key certificate (public info - compare with Play Console > App integrity > Upload key certificate):"
          keytool -list -v -keystore "$KS" -storepass:env PLAY_KEYSTORE_PASSWORD -alias "$PLAY_KEY_ALIAS" \
            | grep -E 'Owner:|SHA1:|SHA256:|Valid from' || true
          echo "KEYSTORE_FILE=$KS" >> "$GITHUB_ENV"

      - name: Build release AAB
        env:
          KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          set -o pipefail
          if [ "${KEYSTORE_IS_PKCS12:-}" = 1 ]; then export KEY_PASSWORD="$KEYSTORE_PASSWORD"; fi
          if ! gradle bundleRelease --no-daemon 2>&1 | tee "$RUNNER_TEMP/gradle.log"; then
            # Surface the real Gradle error in the run summary
            grep -A 12 -E 'What went wrong|^e: |Lint found' "$RUNNER_TEMP/gradle.log" | head -40 | while IFS= read -r line; do
              echo "::error::$line"
            done
            exit 1
          fi

      - name: Verify AAB (signature, id, version, size)
        env:
          KEYSTORE_PASSWORD: ${{ secrets.PLAY_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.PLAY_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.PLAY_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ "${KEYSTORE_IS_PKCS12:-}" = 1 ]; then export KEY_PASSWORD="$KEYSTORE_PASSWORD"; fi
          AAB=app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::$AAB not found"; exit 1; }

          SIZE=$(stat -c %s "$AAB")
          echo "AAB size: $SIZE bytes"
          [ "$SIZE" -gt 500000 ] || { echo "::error::AAB is suspiciously small"; exit 1; }

          # 1) JAR signature must exist, be valid, and come from the upload key (not the debug key)
          unzip -l "$AAB" | grep -E 'META-INF/.*\.(RSA|DSA|EC)$' || { echo "::error::AAB has no signature block in META-INF"; exit 1; }
          # No -strict: it fails on the self-signed certificate every Play upload key has
          jarsigner -verify "$AAB" > "$RUNNER_TEMP/jarsigner.txt" 2>&1 || { cat "$RUNNER_TEMP/jarsigner.txt"; echo "::error::jarsigner verification failed: $(grep -v '^$' "$RUNNER_TEMP/jarsigner.txt" | head -3 | tr '\n' ' ')"; exit 1; }
          cat "$RUNNER_TEMP/jarsigner.txt"
          grep -q 'jar verified' "$RUNNER_TEMP/jarsigner.txt" || { echo "::error::AAB not verified"; exit 1; }
          if grep -q 'jar is unsigned' "$RUNNER_TEMP/jarsigner.txt"; then echo "::error::AAB is unsigned"; exit 1; fi
          grep -v '^$' "$RUNNER_TEMP/jarsigner.txt" | while IFS= read -r line; do echo "::notice title=jarsigner::$line"; done
          SIGNER=$(keytool -printcert -jarfile "$AAB")
          echo "$SIGNER" | grep -E 'Owner:|SHA256:'
          if echo "$SIGNER" | grep -q 'CN=Android Debug'; then echo "::error::AAB is signed with the DEBUG key"; exit 1; fi
          AAB_SHA=$(echo "$SIGNER" | grep -m1 'SHA256:' | awk '{print $2}')
          KEY_SHA=$(keytool -list -v -keystore "$KEYSTORE_FILE" -storepass:env KEYSTORE_PASSWORD -alias "$KEY_ALIAS" | grep -m1 'SHA256:' | awk '{print $2}')
          [ -n "$AAB_SHA" ] && [ "$AAB_SHA" = "$KEY_SHA" ] || { echo "::error::AAB signer does not match the upload key"; exit 1; }
          echo "Signer matches upload key: OK"

          # 2) Manifest values via bundletool
          curl -fsSL -o "$RUNNER_TEMP/bundletool.jar" \
            "https://github.com/google/bundletool/releases/download/${BUNDLETOOL_VERSION}/bundletool-all-${BUNDLETOOL_VERSION}.jar"
          BT="java -jar $RUNNER_TEMP/bundletool.jar"
          PKG=$($BT dump manifest --bundle "$AAB" --xpath /manifest/@package)
          VC=$($BT dump manifest --bundle "$AAB" --xpath /manifest/@android:versionCode)
          VN=$($BT dump manifest --bundle "$AAB" --xpath /manifest/@android:versionName)
          echo "applicationId=$PKG versionCode=$VC versionName=$VN"
          [ "$PKG" = "$EXPECTED_APPLICATION_ID" ] || { echo "::error::Unexpected applicationId $PKG"; exit 1; }
          $BT validate --bundle "$AAB" > /dev/null

          # 3) Build an APK set signed with the same key and verify with apksigner
          $BT build-apks --bundle "$AAB" --output "$RUNNER_TEMP/app.apks" --mode universal \
            --ks "$KEYSTORE_FILE" --ks-pass env:KEYSTORE_PASSWORD --ks-key-alias "$KEY_ALIAS" --key-pass env:KEY_PASSWORD
          mkdir -p "$RUNNER_TEMP/apks" && unzip -o -q "$RUNNER_TEMP/app.apks" -d "$RUNNER_TEMP/apks"
          APKSIGNER=$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner
          "$APKSIGNER" verify --verbose --print-certs "$RUNNER_TEMP/apks/universal.apk" | grep -E 'Verified using|Signer #1 certificate (DN|SHA-256)'

          {
            echo "## Play AAB"
            echo "| Check | Result |"
            echo "|---|---|"
            echo "| File | app-release.aab ($SIZE bytes) |"
            echo "| applicationId | $PKG |"
            echo "| versionCode | $VC |"
            echo "| versionName | $VN |"
            echo "| Signed with upload key | YES (SHA-256 $AAB_SHA) |"
            echo "| bundletool validate | OK |"
            echo "| apksigner (universal APK) | OK |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed Play AAB
        uses: actions/upload-artifact@v6
        with:
          name: keyfe-keder-radyo-play-aab
          path: app/build/outputs/bundle/release/app-release.aab
          if-no-files-found: error

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/play-release.keystore" "$RUNNER_TEMP/app.apks"; rm -rf "$RUNNER_TEMP/apks"
